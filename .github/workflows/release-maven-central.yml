name: Release to Maven Central

# Publishes org.jrebirth:organization to the Sonatype Central Publisher Portal.
# Local credentials in ~/.m2/settings.xml are NOT available here — use GitHub secrets.
#
# Triggers:
#   - Push tag organization-X.Y.Z
#   - Manual workflow_dispatch with a release version
#
# Required repository secrets:
#   CENTRAL_USERNAME   — Central Portal user token username (settings.xml <server><id>central</id>)
#   CENTRAL_TOKEN      — Central Portal user token password
#   GPG_PRIVATE_KEY    — ASCII-armored private key:
#                        gpg --armor --export-secret-keys <KEYID>
#   GPG_PASSPHRASE     — passphrase for that key
#
# Signing uses maven-gpg-plugin Bouncy Castle signer (-Dgpg.signer=bc) so the key
# is read from MAVEN_GPG_KEY — no gpg keyring import on the runner.

on:
  push:
    tags:
      - "organization-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 6.0.0). Sets POM version before deploy."
        required: true
        type: string
      auto_publish:
        description: "Auto-publish on Central after validation"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: maven-central-organization
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      POM: org.jrebirth.organization/pom.xml
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight secrets
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for name in CENTRAL_USERNAME CENTRAL_TOKEN MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            val="${!name}"
            if [[ -z "${val}" ]]; then
              echo "::error::Secret/env ${name} is empty or missing in repo Actions secrets"
              fail=1
            else
              echo "${name}: present (${#val} chars)"
            fi
          done
          if [[ -n "${MAVEN_GPG_KEY}" ]] && ! grep -Eq 'BEGIN (PGP |OPENPGP )?PRIVATE KEY' <<< "${MAVEN_GPG_KEY}"; then
            echo "::error::GPG_PRIVATE_KEY must be ASCII-armored (gpg --armor --export-secret-keys <KEYID>)"
            fail=1
          fi
          exit "${fail}"

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#organization-}"
          fi
          if [[ -z "${VERSION}" || "${VERSION}" == *SNAPSHOT* ]]; then
            echo "::error::Refusing SNAPSHOT or empty version: '${VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Set up JDK + Central credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Set POM version
        run: >
          mvn -f "${POM}" -B
          org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion=${{ steps.ver.outputs.version }}
          -DgenerateBackupPoms=false

      - name: Deploy to Maven Central
        env:
          # Tags always auto-publish; workflow_dispatch uses the checkbox input.
          AUTO_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.auto_publish }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${AUTO_PUBLISH}" == "true" ]]; then
            EXTRA+=(
              -Dcentral.publishing.autoPublish=true
              -Dcentral.publishing.waitUntil=published
            )
          else
            EXTRA+=(
              -Dcentral.publishing.autoPublish=false
              -Dcentral.publishing.waitUntil=validated
            )
          fi
          # BC signer reads MAVEN_GPG_KEY / MAVEN_GPG_PASSPHRASE (no gpg keyring).
          mvn -f "${POM}" -B -Pdeploy-central clean deploy \
            -DskipTests \
            -Dgpg.signer=bc \
            "${EXTRA[@]}"
